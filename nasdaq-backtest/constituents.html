<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态前10成分追踪 · 纳斯达克</title>
<link rel="stylesheet" href="css/style.css">
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 8px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; }
  td.rank { color: var(--gold); font-weight: 700; width: 48px; }
  td.sym { font-weight: 700; color: var(--accent1); }
  td.mcap, td.wt { text-align: right; font-variant-numeric: tabular-nums; }
  .tag-new { color: var(--up); font-size: 11px; margin-left: 4px; }
  .tag-out { color: var(--down); }
  #change-info { font-size: 12px; color: var(--dim); min-height: 20px; margin-top: 4px; }
  .month-big { font-size: 18px; font-weight: 700; color: var(--gold); margin: 0 8px; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent1); }
  .controls button { background: var(--accent1); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 700; }
  .note { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .vt { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; margin-right: 18px; cursor: pointer; }
  .vt input { accent-color: var(--accent1); }
  /* 调仓明细 */
  .rb-head { font-size: 15px; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
  .rb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .rb-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #0d1117; }
  .rb-card.buy { border-top: 3px solid var(--up); }
  .rb-card.sell { border-top: 3px solid var(--down); }
  .rb-card.hold { border-top: 3px solid var(--dim); }
  .rb-card h3 { font-size: 13px; margin-bottom: 8px; color: var(--text); }
  .rb-list { font-size: 13px; line-height: 1.9; min-height: 24px; }
  .rb-item { display: inline-block; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 9px; margin: 2px; }
  .rb-item b { color: var(--accent1); }
  .rb-item small { color: var(--dim); margin-left: 4px; }
  .rb-none { color: var(--dim); font-style: italic; }
  @media (max-width: 720px) { .rb-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>📊 纳斯达克前10 动态追踪</h1>
  <p class="sub">按月末市值排名 · 从历史成分名单动态选取 · <a href="index.html" class="nav">← 返回回测</a></p>
</header>

<main>
  <section class="panel controls">
    <button id="prev">◀</button>
    <input type="range" id="range" min="0" max="0" value="0">
    <button id="next">▶</button>
    <span class="month-big" id="label"></span>
    <button id="play">▶ 播放</button>
    <span id="rank-note" class="note"></span>
  </section>

  <section class="panel">
    <label class="vt"><input type="radio" name="view" value="monthly" checked> 📈 月度排名</label>
    <label class="vt"><input type="radio" name="view" value="rebalance"> 🔀 调仓明细（季度）</label>
  </section>

  <!-- 月度排名视图 -->
  <section class="panel" id="monthly-view">
    <div id="change-info"></div>
    <table id="table">
      <thead>
        <tr><th>排名</th><th>代码</th><th>名称</th><th>市值($B)</th><th>权重</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="note">口径：市值 = 月末价 × 最新股本（近似）；成分资格按月末时点判断；早期已退市标的可能因数据缺失被跳过，仅供研究。</div>
  </section>

  <!-- 调仓明细视图 -->
  <section class="panel" id="rebalance-view" style="display:none">
    <div class="rb-head" id="rb-head"></div>
    <div class="rb-grid">
      <div class="rb-card buy"><h3>🟢 买入（新进前10）</h3><div id="rb-buy" class="rb-list"></div></div>
      <div class="rb-card sell"><h3>🔴 卖出（跌出前10）</h3><div id="rb-sell" class="rb-list"></div></div>
      <div class="rb-card hold"><h3>⚪ 持有（调仓回10%）</h3><div id="rb-hold" class="rb-list"></div></div>
    </div>
    <div class="note">等权再平衡：每个季度末卖出「跌出者」、买入「新进者」，仍在榜上的持有者调回各 10% 权重。名单无变化的季度也会做等权再平衡。</div>
  </section>
</main>

<script src="js/constituents.js"></script>
</body>
</html>
